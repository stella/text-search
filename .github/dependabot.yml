version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "📦 dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"

  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/wasm"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      napi:
        patterns:
          - "@napi-rs/*"
          - "napi*"
        update-types:
          - "major"
      emnapi:
        patterns:
          - "@emnapi/*"
          - "emnapi"
          - "@napi-rs/wasm-runtime"
          - "@tybys/wasm-util"
        update-types:
          - "major"
      oxc:
        patterns:
          - "oxlint"
          - "oxlint-tsgolint"
          - "oxfmt"
        update-types:
          - "major"
    labels:
      - "📦 dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"
