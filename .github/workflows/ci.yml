name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code-changed: ${{ steps.filter.outputs.code }}
      provenance-changed: ${{ steps.filter.outputs.provenance }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            code:
              - '.github/workflows/**'
              - 'VERSION'
              - '__test__/**'
              - 'src/**'
              - 'scripts/**'
              - 'bunfig.toml'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'tsdown.config.ts'
              - '.provenance.yml'
              - 'provenance/**'
              - 'wasm/**'
            provenance:
              - '.github/workflows/**'
              - 'VERSION'
              - 'bunfig.toml'
              - 'bun.lock'
              - '**/package.json'
              - 'src/**'
              - 'scripts/**'
              - 'wasm/**'
              - '.provenance.yml'
              - 'provenance/**'

  trust-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
      - name: Check if PR is trusted
        id: check
        env:
          HEAD_REPO: >-
            ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REPO" == "$BASE_REPO" ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          elif [[ '${{ contains(github.event.pull_request.labels.*.name, 'run-ci') }}' == 'true' ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fork PR without 'run-ci' label — CI skipped."
          fi

  changeset:
    name: Changeset
    if: >-
      github.event_name == 'pull_request'
      && needs.trust-check.outputs.trusted == 'true'
    needs: [trust-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: stella/.github/.github/actions/changeset-policy@42bd6a23099a2dc219dd1af9c55f8f0506fcfffd
        with:
          release-paths: |
            src/**
            crates/core/src/**
            Cargo.toml
            crates/core/Cargo.toml
            package.json
            wasm/package.json
            tsdown.config.ts
          generated-paths: |
            CHANGELOG.md
            VERSION
            Cargo.toml
            Cargo.lock
            bun.lock
            package.json
            wasm/package.json
            provenance/THIRD-PARTY-NOTICES.repo.txt
            provenance/report.json
            provenance/projects/root/THIRD-PARTY-NOTICES.txt
            provenance/projects/root/sbom.cdx.json
            provenance/projects/wasm/THIRD-PARTY-NOTICES.txt
            provenance/projects/wasm/sbom.cdx.json
          package-files: package.json

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail

          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      - name: Lint workflows
        run: '"${RUNNER_TEMP}/actionlint" -color'

  version-sync:
    name: Version sync
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [trust-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
      - run: node scripts/version-sync.mjs check

  lint:
    name: Lint
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [check-changes, trust-check, workflow-lint, version-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip when lint is not required
        if: needs.check-changes.outputs.code-changed != 'true'
        run: echo "No trusted code changes; lint skipped."
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: needs.check-changes.outputs.code-changed == 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: needs.check-changes.outputs.code-changed == 'true'
      - run: bun install --frozen-lockfile
        if: needs.check-changes.outputs.code-changed == 'true'
      - run: bun run lint
        if: needs.check-changes.outputs.code-changed == 'true'

  test:
    name: Test
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [check-changes, trust-check, version-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip when tests are not required
        if: needs.check-changes.outputs.code-changed != 'true'
        run: echo "No trusted code changes; tests skipped."
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: needs.check-changes.outputs.code-changed == 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: needs.check-changes.outputs.code-changed == 'true'
      - run: bun install --frozen-lockfile
        if: needs.check-changes.outputs.code-changed == 'true'
      - run: bun test
        if: needs.check-changes.outputs.code-changed == 'true'

  runtime-compat:
    name: Runtime - ${{ matrix.runtime }} / ${{ matrix.os }}
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [check-changes, trust-check, version-sync]
    runs-on: >-
      ${{
        needs.check-changes.outputs.code-changed == 'true'
        && matrix.os
        || 'ubuntu-latest'
      }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: bun
          - os: ubuntu-latest
            runtime: node
          - os: macos-15
            runtime: bun
          - os: macos-15
            runtime: node
    steps:
      - name: Skip when runtime checks are not required
        if: needs.check-changes.outputs.code-changed != 'true'
        run: echo "No trusted code changes; runtime checks skipped."
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: needs.check-changes.outputs.code-changed == 'true'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: needs.check-changes.outputs.code-changed == 'true'
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: needs.check-changes.outputs.code-changed == 'true'
      - run: bun install --frozen-lockfile
        if: needs.check-changes.outputs.code-changed == 'true'
      - run: bun run build:js
        if: needs.check-changes.outputs.code-changed == 'true'
      - name: Bun runtime smoke
        if: >-
          needs.check-changes.outputs.code-changed == 'true'
          && matrix.runtime == 'bun'
        run: bun run test:runtime:bun
      - name: Node runtime smoke
        if: >-
          needs.check-changes.outputs.code-changed == 'true'
          && matrix.runtime == 'node'
        run: bun run test:runtime:node

  pack:
    name: Pack
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [check-changes, trust-check, version-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip when packaging is not required
        if: needs.check-changes.outputs.code-changed != 'true'
        run: echo "No trusted code changes; pack skipped."
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: needs.check-changes.outputs.code-changed == 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: needs.check-changes.outputs.code-changed == 'true'
      - run: bun install --frozen-lockfile
        if: needs.check-changes.outputs.code-changed == 'true'
      - run: bun run build:js
        if: needs.check-changes.outputs.code-changed == 'true'
      - name: npm consumer smoke
        if: needs.check-changes.outputs.code-changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          consumer_dir="$(mktemp -d)"
          npm pack --json --ignore-scripts --pack-destination "$consumer_dir" >/dev/null
          tarball="$(find "$consumer_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [ -z "$tarball" ]; then
            echo "::error::npm pack did not produce a tarball."
            exit 1
          fi

          cd "$consumer_dir"
          npm install --ignore-scripts --include=optional "$tarball"
          node --input-type=module -e '
            const { TextSearch } = await import("@stll/text-search");
            const search = new TextSearch(["contract"]);
            if (!search.isMatch("contract")) process.exit(1);
          '
      - run: cd wasm && npm pack --json --ignore-scripts --dry-run
        if: needs.check-changes.outputs.code-changed == 'true'

  provenance:
    name: Provenance
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [check-changes, trust-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Skip when provenance is not required
        if: needs.check-changes.outputs.provenance-changed != 'true'
        run: echo "No trusted provenance changes; provenance check skipped."
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: needs.check-changes.outputs.provenance-changed == 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: needs.check-changes.outputs.provenance-changed == 'true'
      - run: bun install --frozen-lockfile
        if: needs.check-changes.outputs.provenance-changed == 'true'
      - uses: stella/.github/actions/provenance-check@3f01e79c9fb39929940e6736a7f12192a3be7321
        if: needs.check-changes.outputs.provenance-changed == 'true'
        with:
          provenance-version: v0.1.3
