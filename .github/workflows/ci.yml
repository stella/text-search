name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code-changed: ${{ steps.filter.outputs.code }}
      provenance-changed: ${{ steps.filter.outputs.provenance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            code:
              - '.github/workflows/**'
              - 'VERSION'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'hawk.toml'
              - '__test__/**'
              - 'crates/**'
              - 'src/**'
              - 'scripts/**'
              - 'bunfig.toml'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'tsdown.config.ts'
              - '.provenance.yml'
              - 'provenance/**'
              - 'wasm/**'
            provenance:
              - '.github/workflows/**'
              - 'VERSION'
              - 'bunfig.toml'
              - 'bun.lock'
              - '**/package.json'
              - 'src/**'
              - 'scripts/**'
              - 'wasm/**'
              - '.provenance.yml'
              - 'provenance/**'

  trust-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
      - name: Check if PR is trusted
        id: check
        env:
          HEAD_REPO: >-
            ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REPO" == "$BASE_REPO" ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          elif [[ '${{ contains(github.event.pull_request.labels.*.name, 'run-ci') }}' == 'true' ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fork PR without 'run-ci' label — CI skipped."
          fi

  changeset:
    name: Changeset
    if: >-
      github.event_name == 'pull_request'
      && needs.trust-check.outputs.trusted == 'true'
    needs: [trust-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: stella/.github/.github/actions/changeset-policy@b8c0884053fb8d4fb6ba157692189e0f1aae1785
        with:
          release-paths: |
            src/**
            crates/core/src/**
            Cargo.toml
            crates/core/Cargo.toml
            package.json
            wasm/package.json
            tsdown.config.ts
          generated-paths: |
            CHANGELOG.md
            VERSION
            Cargo.toml
            Cargo.lock
            bun.lock
            package.json
            wasm/package.json
            provenance/THIRD-PARTY-NOTICES.repo.txt
            provenance/report.json
            provenance/projects/root/THIRD-PARTY-NOTICES.txt
            provenance/projects/root/sbom.cdx.json
            provenance/projects/wasm/THIRD-PARTY-NOTICES.txt
            provenance/projects/wasm/sbom.cdx.json
          package-files: package.json

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail

          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      - name: Lint workflows
        run: '"${RUNNER_TEMP}/actionlint" -color'

  version-sync:
    name: Version sync
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [trust-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node scripts/version-sync.mjs check

  lint:
    name: Lint
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [check-changes, trust-check, workflow-lint, version-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip when lint is not required
        if: needs.check-changes.outputs.code-changed != 'true'
        run: echo "No trusted code changes; lint skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.check-changes.outputs.code-changed == 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: needs.check-changes.outputs.code-changed == 'true'
      - run: bun install --frozen-lockfile
        if: needs.check-changes.outputs.code-changed == 'true'
      - run: bun run lint
        if: needs.check-changes.outputs.code-changed == 'true'

  test:
    name: Test
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [check-changes, trust-check, version-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip when tests are not required
        if: needs.check-changes.outputs.code-changed != 'true'
        run: echo "No trusted code changes; tests skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.check-changes.outputs.code-changed == 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: needs.check-changes.outputs.code-changed == 'true'
      - run: bun install --frozen-lockfile
        if: needs.check-changes.outputs.code-changed == 'true'
      - run: bun test
        if: needs.check-changes.outputs.code-changed == 'true'

  rust:
    name: Rust
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [check-changes, trust-check, version-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip when Rust checks are not required
        if: needs.check-changes.outputs.code-changed != 'true'
        run: echo "No trusted code changes; Rust checks skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.check-changes.outputs.code-changed == 'true'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: needs.check-changes.outputs.code-changed == 'true'
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: needs.check-changes.outputs.code-changed == 'true'
      - run: cargo fmt --all -- --check
        if: needs.check-changes.outputs.code-changed == 'true'
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        if: needs.check-changes.outputs.code-changed == 'true'
      - run: cargo test --workspace --all-features
        if: needs.check-changes.outputs.code-changed == 'true'
      - run: cargo check -p stella-text-search-core --target wasm32-unknown-unknown
        if: needs.check-changes.outputs.code-changed == 'true'

  hawk:
    name: Hawk
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [check-changes, trust-check, version-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAWK_RUST_TOOLCHAIN: "1.97.1"
      HAWK_VERSION: "0.1.12"
      HAWK_SHA256: f9cafbbc5777b2b00c362619b8b62af942d2900a121acae2e73210a8ebffd857
    steps:
      - name: Skip when Hawk is not required
        if: needs.check-changes.outputs.code-changed != 'true'
        run: echo "No trusted code changes; Hawk skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.check-changes.outputs.code-changed == 'true'
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: needs.check-changes.outputs.code-changed == 'true'
        with:
          toolchain: ${{ env.HAWK_RUST_TOOLCHAIN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: needs.check-changes.outputs.code-changed == 'true'
      - name: Install Hawk
        if: needs.check-changes.outputs.code-changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          expected_hawk_script="cargo +${HAWK_RUST_TOOLCHAIN} hawk check --manifest-path Cargo.toml --target-dir target/hawk -D warnings -A hawk::dead_public -A hawk::unnecessary_public -D hawk::unnecessary_restricted_visibility -D hawk::unnecessary_crate_visibility"
          jq -e --arg expected "$expected_hawk_script" \
            '.scripts["rust:hawk"] == $expected' package.json >/dev/null
          archive="${RUNNER_TEMP}/cargo-hawk.tar.gz"
          install_dir="${RUNNER_TEMP}/cargo-hawk"
          curl --proto '=https' --tlsv1.2 --retry 3 -fsSL \
            --output "$archive" \
            "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${HAWK_SHA256}  ${archive}" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1 \
            cargo-hawk-x86_64-unknown-linux-gnu/cargo-hawk \
            cargo-hawk-x86_64-unknown-linux-gnu/cargo-hawk-driver
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Check internal Rust visibility
        if: needs.check-changes.outputs.code-changed == 'true'
        run: bun run rust:hawk

  runtime-compat:
    name: Runtime - ${{ matrix.runtime }} / ${{ matrix.os }}
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [check-changes, trust-check, version-sync]
    runs-on: >-
      ${{
        needs.check-changes.outputs.code-changed == 'true'
        && matrix.os
        || 'ubuntu-latest'
      }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: bun
          - os: ubuntu-latest
            runtime: node
          - os: macos-15
            runtime: bun
          - os: macos-15
            runtime: node
    steps:
      - name: Skip when runtime checks are not required
        if: needs.check-changes.outputs.code-changed != 'true'
        run: echo "No trusted code changes; runtime checks skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.check-changes.outputs.code-changed == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.check-changes.outputs.code-changed == 'true'
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: needs.check-changes.outputs.code-changed == 'true'
      - run: bun install --frozen-lockfile
        if: needs.check-changes.outputs.code-changed == 'true'
      - run: bun run build:js
        if: needs.check-changes.outputs.code-changed == 'true'
      - name: Bun runtime smoke
        if: >-
          needs.check-changes.outputs.code-changed == 'true'
          && matrix.runtime == 'bun'
        run: bun run test:runtime:bun
      - name: Node runtime smoke
        if: >-
          needs.check-changes.outputs.code-changed == 'true'
          && matrix.runtime == 'node'
        run: bun run test:runtime:node

  pack:
    name: Pack
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [check-changes, trust-check, version-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip when packaging is not required
        if: needs.check-changes.outputs.code-changed != 'true'
        run: echo "No trusted code changes; pack skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.check-changes.outputs.code-changed == 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: needs.check-changes.outputs.code-changed == 'true'
      - run: bun install --frozen-lockfile
        if: needs.check-changes.outputs.code-changed == 'true'
      - run: bun run build:js
        if: needs.check-changes.outputs.code-changed == 'true'
      - name: npm consumer smoke
        if: needs.check-changes.outputs.code-changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          consumer_dir="$(mktemp -d)"
          npm pack --json --ignore-scripts --pack-destination "$consumer_dir" >/dev/null
          tarball="$(find "$consumer_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [ -z "$tarball" ]; then
            echo "::error::npm pack did not produce a tarball."
            exit 1
          fi

          cd "$consumer_dir"
          npm install --ignore-scripts --include=optional "$tarball"
          node --input-type=module -e '
            const { TextSearch } = await import("@stll/text-search");
            const search = new TextSearch(["contract"]);
            if (!search.isMatch("contract")) process.exit(1);
          '
      - run: cd wasm && npm pack --json --ignore-scripts --dry-run
        if: needs.check-changes.outputs.code-changed == 'true'

  provenance:
    name: Provenance
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [check-changes, trust-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Skip when provenance is not required
        if: needs.check-changes.outputs.provenance-changed != 'true'
        run: echo "No trusted provenance changes; provenance check skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.check-changes.outputs.provenance-changed == 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: needs.check-changes.outputs.provenance-changed == 'true'
      - run: bun install --frozen-lockfile
        if: needs.check-changes.outputs.provenance-changed == 'true'
      - uses: stella/.github/actions/provenance-check@9a6f0b6dd423b9c368c63d9466b1aebbe6984ba3
        if: needs.check-changes.outputs.provenance-changed == 'true'
        with:
          provenance-version: v0.1.3
