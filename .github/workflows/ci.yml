name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code-changed: ${{ steps.filter.outputs.code }}
      provenance-changed: ${{ steps.filter.outputs.provenance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            code:
              - '.node-version'
              - '**/rust-toolchain'
              - '**/rust-toolchain.toml'
              - 'stll-toolchain.json'
              - '.github/workflows/**'
              - 'VERSION'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'hawk.toml'
              - '__test__/**'
              - 'crates/**'
              - 'src/**'
              - 'scripts/**'
              - 'bunfig.toml'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'tsdown.config.ts'
              - '.provenance.yml'
              - 'provenance/**'
              - 'wasm/**'
            provenance:
              - '.node-version'
              - '**/rust-toolchain'
              - '**/rust-toolchain.toml'
              - 'stll-toolchain.json'
              - '.github/workflows/**'
              - 'VERSION'
              - 'bunfig.toml'
              - 'bun.lock'
              - '**/package.json'
              - 'src/**'
              - 'scripts/**'
              - 'wasm/**'
              - '.provenance.yml'
              - 'provenance/**'

  trust-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
      - name: Check if PR is trusted
        id: check
        env:
          HEAD_REPO: >-
            ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REPO" == "$BASE_REPO" ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          elif [[ '${{ contains(github.event.pull_request.labels.*.name, 'run-ci') }}' == 'true' ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fork PR without 'run-ci' label — CI skipped."
          fi

  changeset:
    name: Changeset
    if: >-
      github.event_name == 'pull_request'
      && needs.trust-check.outputs.trusted == 'true'
    needs: [trust-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: stella/.github/.github/actions/changeset-policy@5764ab66e4df84cfd2e642c7d7e4678261e668f8 # v1.7.1
        with:
          release-paths: |
            src/**
            crates/core/src/**
            Cargo.toml
            crates/core/Cargo.toml
            package.json
            wasm/package.json
            tsdown.config.ts
          generated-paths: |
            CHANGELOG.md
            VERSION
            Cargo.toml
            Cargo.lock
            bun.lock
            package.json
            wasm/package.json
            provenance/THIRD-PARTY-NOTICES.repo.txt
            provenance/report.json
            provenance/projects/root/THIRD-PARTY-NOTICES.txt
            provenance/projects/root/sbom.cdx.json
            provenance/projects/wasm/THIRD-PARTY-NOTICES.txt
            provenance/projects/wasm/sbom.cdx.json
          package-files: package.json

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail

          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      - name: Lint workflows
        run: '"${RUNNER_TEMP}/actionlint" -color'

  version-sync:
    name: Release Node selector and version sync
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [trust-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: node scripts/version-sync.mjs check

  lint:
    name: Lint
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
      && needs.check-changes.outputs.code-changed == 'true'
    needs: [check-changes, trust-check, workflow-lint, version-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check:toolchain
      - run: bun run typecheck
      - run: bun run check:typecheck-parity
      - run: bun run lint

  test:
    name: Test
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
      && needs.check-changes.outputs.code-changed == 'true'
    needs: [check-changes, trust-check, version-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test

  rust:
    name: Rust
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
      && needs.check-changes.outputs.code-changed == 'true'
    needs: [check-changes, trust-check, version-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      STELLA_SOURCE_LINT_REV: a1bd81740ecb4b66999f56d1716e1190c4e7272f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: source-lint-cache
        with:
          path: ${{ runner.temp }}/stella-source-lint/bin
          key: stella-source-lint-${{ runner.os }}-${{ runner.arch }}-${{ env.STELLA_SOURCE_LINT_REV }}
      - name: Install stable Rust source checker
        if: steps.source-lint-cache.outputs.cache-hit != 'true'
        run: >-
          cargo install --git https://github.com/stella/tooling
          --rev "$STELLA_SOURCE_LINT_REV" --locked
          --root "$RUNNER_TEMP/stella-source-lint" stella_source_lint
      - run: echo "$RUNNER_TEMP/stella-source-lint/bin" >> "$GITHUB_PATH"
      - run: cargo stella-lint .
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo check -p stella-text-search-core --target wasm32-unknown-unknown

  hawk:
    name: Hawk
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
      && needs.check-changes.outputs.code-changed == 'true'
    needs: [check-changes, trust-check, version-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAWK_RUST_TOOLCHAIN: "1.97.1"
      HAWK_VERSION: "0.1.12"
      HAWK_SHA256: f9cafbbc5777b2b00c362619b8b62af942d2900a121acae2e73210a8ebffd857
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1 # Hawk exception: tooling#99, expires 2026-11-11
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install Hawk
        shell: bash
        run: |
          set -euo pipefail

          expected_hawk_script="cargo +${HAWK_RUST_TOOLCHAIN} hawk check --manifest-path Cargo.toml --target-dir target/hawk -D warnings -A hawk::dead_public -A hawk::unnecessary_public -D hawk::unnecessary_restricted_visibility -D hawk::unnecessary_crate_visibility"
          jq -e --arg expected "$expected_hawk_script" \
            '.scripts["rust:hawk"] == $expected' package.json >/dev/null
          archive="${RUNNER_TEMP}/cargo-hawk.tar.gz"
          install_dir="${RUNNER_TEMP}/cargo-hawk"
          curl --proto '=https' --tlsv1.2 --retry 3 -fsSL \
            --output "$archive" \
            "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${HAWK_SHA256}  ${archive}" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1 \
            cargo-hawk-x86_64-unknown-linux-gnu/cargo-hawk \
            cargo-hawk-x86_64-unknown-linux-gnu/cargo-hawk-driver
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Check internal Rust visibility
        run: bun run rust:hawk

  runtime-compat:
    name: Runtime - ${{ matrix.runtime }} / ${{ matrix.os }}
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
      && needs.check-changes.outputs.code-changed == 'true'
    needs: [check-changes, trust-check, version-sync]
    runs-on: >-
      ${{
        needs.check-changes.outputs.code-changed == 'true'
        && matrix.os
        || 'ubuntu-latest'
      }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: bun
          - os: ubuntu-latest
            runtime: node
          - os: macos-15
            runtime: bun
          - os: macos-15
            runtime: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build:js
      - name: Bun runtime smoke
        if: >-
          matrix.runtime == 'bun'
        run: bun run test:runtime:bun
      - name: Node runtime smoke
        if: >-
          matrix.runtime == 'node'
        run: bun run test:runtime:node

  pack:
    name: Pack
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
      && needs.check-changes.outputs.code-changed == 'true'
    needs: [check-changes, trust-check, version-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build:js
      - name: npm consumer smoke
        shell: bash
        run: |
          set -euo pipefail

          consumer_dir="$(mktemp -d)"
          npm pack --json --ignore-scripts --pack-destination "$consumer_dir" >/dev/null
          tarball="$(find "$consumer_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [ -z "$tarball" ]; then
            echo "::error::npm pack did not produce a tarball."
            exit 1
          fi

          cd "$consumer_dir"
          npm install --ignore-scripts --include=optional "$tarball"
          node --input-type=module -e '
            const { TextSearch } = await import("@stll/text-search");
            const search = new TextSearch(["contract"]);
            if (!search.isMatch("contract")) process.exit(1);
          '
      - run: cd wasm && npm pack --json --ignore-scripts --dry-run

  provenance:
    name: Provenance
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
      && needs.check-changes.outputs.provenance-changed == 'true'
    needs: [check-changes, trust-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: stella/.github/actions/provenance-check@5764ab66e4df84cfd2e642c7d7e4678261e668f8
        with:
          provenance-version: v0.1.3
