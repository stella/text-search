name: Release policy

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-policy.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-policy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce release boundaries
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/release-policy.yml@8f19eb7220047e5b06f6e75f0b9f908bfd01f5f6
