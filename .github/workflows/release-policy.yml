name: Release policy

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-policy.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-policy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce release boundaries
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/release-policy.yml@9e1915536efc226c5ec9d3ca0f2192be5aa6ec7e
