name: Release

env:
  NODE_VERSION: "22"
  CDXGEN_VERSION: "12.1.5"

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: Publish the current VERSION to npm after verification
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-ref:
    name: Release ref
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.publish_to_npm
      && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: |
          echo "::error::Manual npm publishing must run from main."
          exit 1

  preflight:
    name: Preflight
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.publish_to_npm != true
      || github.ref == 'refs/heads/main'
    uses: stella/.github/.github/workflows/npm-version-preflight.yml@48aacae31829ce15216a6b766b03a92fd2e84da3
    with:
      package-files: |
        package.json
        wasm/package.json
      publish-to-npm: >-
        ${{ github.event_name == 'push'
            || (inputs.publish_to_npm && github.ref == 'refs/heads/main') }}

  verify:
    name: Verify
    needs: preflight
    if: needs.preflight.outputs.already-released != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: node scripts/version-sync.mjs check
      - run: bun install --frozen-lockfile
      - run: bun run lint

      - uses: stella/.github/actions/provenance-check@48aacae31829ce15216a6b766b03a92fd2e84da3
        with:
          provenance-version: v0.1.3

      - run: bun test
      - run: bun run build:js
      - run: bun run test:runtime:bun
      - run: bun run test:runtime:node

  pack:
    name: Pack
    needs: [preflight, verify]
    if: needs.preflight.outputs.already-released != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: npm install --global "@cyclonedx/cdxgen@${{ env.CDXGEN_VERSION }}"
      - run: bun run build:js

      - name: Pack release tarballs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          npm pack --json --ignore-scripts --pack-destination release-artifacts
          (
            cd wasm
            npm pack --json --ignore-scripts --pack-destination ../release-artifacts
          )
          (
            cd release-artifacts
            sha256sum -- ./*.tgz > SHA256SUMS
          )

      - name: Generate attestation SBOM
        run: cdxgen -o release-artifacts/sbom.attest.cdx.json

      - name: Stage provenance release assets
        shell: bash
        run: |
          set -euo pipefail
          cp provenance/report.json release-artifacts/provenance-report.json
          cp provenance/THIRD-PARTY-NOTICES.repo.txt \
            release-artifacts/provenance-THIRD-PARTY-NOTICES.repo.txt
          cp provenance/projects/root/sbom.cdx.json \
            release-artifacts/provenance-root-sbom.cdx.json
          cp provenance/projects/root/THIRD-PARTY-NOTICES.txt \
            release-artifacts/provenance-root-THIRD-PARTY-NOTICES.txt
          cp provenance/projects/wasm/sbom.cdx.json \
            release-artifacts/provenance-wasm-sbom.cdx.json
          cp provenance/projects/wasm/THIRD-PARTY-NOTICES.txt \
            release-artifacts/provenance-wasm-THIRD-PARTY-NOTICES.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release-artifacts
          if-no-files-found: error

  finalize:
    name: Finalize
    needs: [preflight, pack]
    if: >-
      needs.preflight.outputs.already-released != 'true'
      && (github.event_name == 'push'
          || (inputs.publish_to_npm && github.ref == 'refs/heads/main'))
    uses: stella/.github/.github/workflows/npm-version-finalize.yml@48aacae31829ce15216a6b766b03a92fd2e84da3
    with:
      package-files: |
        package.json
        wasm/package.json
      publish-to-npm: >-
        ${{ github.event_name == 'push'
            || (inputs.publish_to_npm && github.ref == 'refs/heads/main') }}
      update-changelog: false
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    secrets: inherit
