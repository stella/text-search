name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: Publish the current VERSION to npm after verification
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-ref:
    name: Release ref
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.publish_to_npm
      && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: |
          echo "::error::Manual npm publishing must run from main."
          exit 1

  preflight:
    name: Preflight
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.publish_to_npm != true
      || github.ref == 'refs/heads/main'
    uses: stella/.github/.github/workflows/npm-version-preflight.yml@5764ab66e4df84cfd2e642c7d7e4678261e668f8
    with:
      package-files: |
        package.json
        wasm/package.json
      publish-to-npm: >-
        ${{ github.event_name == 'push'
            || (inputs.publish_to_npm && github.ref == 'refs/heads/main') }}

  verify:
    name: Verify
    needs: preflight
    if: needs.preflight.outputs.already-released != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: node scripts/version-sync.mjs check
      - run: bun install --frozen-lockfile
      - run: bun run lint

      - uses: stella/.github/actions/provenance-check@8f19eb7220047e5b06f6e75f0b9f908bfd01f5f6
        with:
          provenance-version: v0.1.3

      - run: bun test
      - run: bun run build:js
      - run: bun run test:runtime:bun
      - run: bun run test:runtime:node

  pack:
    name: Pack
    needs: [preflight, verify]
    if: needs.preflight.outputs.already-released != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - name: Install pinned SBOM generator
        # Lifecycle scripts are unnecessary for this fixed release metadata tool.
        # zizmor: ignore[adhoc-packages]
        env:
          CDXGEN_VERSION: "12.1.5"
        run: npm install --global --ignore-scripts "@cyclonedx/cdxgen@${CDXGEN_VERSION}"
      - run: bun run build:js

      - name: Pack release tarballs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          cp LICENSE NOTICE wasm/

          npm pack --json --ignore-scripts --pack-destination release-artifacts
          (
            cd wasm
            npm pack --json --ignore-scripts --pack-destination ../release-artifacts
          )
          (
            cd release-artifacts
            sha256sum -- ./*.tgz > SHA256SUMS
          )

      - name: Generate attestation SBOM
        run: cdxgen -o release-artifacts/sbom.attest.cdx.json

      - name: Stage provenance release assets
        shell: bash
        run: |
          set -euo pipefail
          cp provenance/report.json release-artifacts/provenance-report.json
          cp provenance/THIRD-PARTY-NOTICES.repo.txt \
            release-artifacts/provenance-THIRD-PARTY-NOTICES.repo.txt
          cp provenance/projects/root/sbom.cdx.json \
            release-artifacts/provenance-root-sbom.cdx.json
          cp provenance/projects/root/THIRD-PARTY-NOTICES.txt \
            release-artifacts/provenance-root-THIRD-PARTY-NOTICES.txt
          cp provenance/projects/wasm/sbom.cdx.json \
            release-artifacts/provenance-wasm-sbom.cdx.json
          cp provenance/projects/wasm/THIRD-PARTY-NOTICES.txt \
            release-artifacts/provenance-wasm-THIRD-PARTY-NOTICES.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release-artifacts
          if-no-files-found: error

  finalize:
    name: Finalize
    needs: [preflight, pack]
    if: >-
      github.ref == 'refs/heads/main'
      && (needs.preflight.outputs.already-released != 'true'
          && (github.event_name == 'push'
              || (inputs.publish_to_npm && github.ref == 'refs/heads/main')))
    uses: stella/.github/.github/workflows/npm-version-finalize.yml@a98150379a0659f9ff603970a06dbdee56f7c4cb
    with:
      package-files: |
        package.json
        wasm/package.json
      publish-to-npm: >-
        ${{ github.event_name == 'push'
            || (inputs.publish_to_npm && github.ref == 'refs/heads/main') }}
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      id-token: write
