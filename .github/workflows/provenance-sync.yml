name: Provenance Sync

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] the shared workflow runs pull request code without secrets and commits only generated provenance
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "bun.lock"
      - "**/package.json"
      - "src/**"
      - "scripts/**"
      - "wasm/**"
      - ".provenance.yml"

concurrency:
  group: provenance-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  sync:
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/provenance-sync.yml@5764ab66e4df84cfd2e642c7d7e4678261e668f8
    with:
      install-command: bun install --frozen-lockfile
      provenance-version: v0.1.3
    secrets:
      app_id: ${{ secrets.CHANGELOG_APP_ID }}
      app_private_key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
