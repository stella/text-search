name: Provenance Sync

# Unprivileged: runs pull request code with no secrets. Provenance Commit
# commits any drift from the default branch through `workflow_run`.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "bun.lock"
      - "**/package.json"
      - "src/**"
      - "scripts/**"
      - "wasm/**"
      - ".provenance.yml"

concurrency:
  group: provenance-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  sync:
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/provenance-sync.yml@44f843221e7c2652dca6fd6c13e345ca96802bc9
    with:
      install-command: bun install --frozen-lockfile
      provenance-version: v0.1.3
