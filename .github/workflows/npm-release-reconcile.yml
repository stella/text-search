name: npm release reconcile

# Publishes GitHub releases that the release finalizer left as drafts because
# npm had not yet listed every accepted package version.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/npm-release-reconcile.yml@6a095097f5f9dc7e157ced38f978802d335baf08
    with:
      package-files: |
        package.json
        wasm/package.json
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
