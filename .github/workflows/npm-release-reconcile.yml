name: npm release reconcile

# Publishes GitHub releases that the release finalizer left as drafts because
# npm had not yet listed every accepted package version.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/npm-release-reconcile.yml@3e9057a176377ddfa34d7897025934d1feb7ce9f
    with:
      package-files: |
        package.json
        wasm/package.json
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
