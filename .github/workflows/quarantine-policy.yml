name: Package quarantine policy

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce package quarantine
    if: github.repository == 'stella/text-search'
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/quarantine-policy.yml@44f843221e7c2652dca6fd6c13e345ca96802bc9
