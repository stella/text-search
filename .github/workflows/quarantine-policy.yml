name: Package quarantine policy

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce package quarantine
    if: github.repository == 'stella/text-search'
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/quarantine-policy.yml@6a095097f5f9dc7e157ced38f978802d335baf08
