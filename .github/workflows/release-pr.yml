name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: stella/.github/.github/workflows/changeset-release-pr.yml@a98150379a0659f9ff603970a06dbdee56f7c4cb
    with:
      sync-cargo-inherited-lock: true
    secrets:
      CHANGELOG_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
