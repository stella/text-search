name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    uses: stella/.github/.github/workflows/changeset-release-pr.yml@412fb4b9cfc8c2b630acdca9cb465d312fe5e362
    with:
      sync-cargo-inherited-lock: true
    secrets:
      CHANGELOG_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
