name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: stella/.github/.github/workflows/changeset-release-pr.yml@28dce62a9e1916b19ce03c8c47a1c44e1a145fdf
    with:
      sync-cargo-inherited-lock: true
    secrets:
      CHANGELOG_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
