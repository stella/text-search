name: Provenance Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  provenance-update:
    permissions:
      contents: write
      pull-requests: write
    uses: stella/.github/.github/workflows/provenance-update.yml@ba5f7da76aededf6f22814de93c72a49843fcc8e
    secrets:
      app_id: ${{ secrets.CHANGELOG_APP_ID }}
      app_private_key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
    with:
      install-command: bun install --frozen-lockfile
      provenance-version: v0.1.3
