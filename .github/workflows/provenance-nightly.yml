name: Provenance Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  provenance-update:
    permissions:
      contents: write
      pull-requests: write
    uses: stella/.github/.github/workflows/provenance-update.yml@7c43baa7e76584907c5b6e2876e1e9962a48518e
    secrets: inherit
    with:
      install-command: bun install --frozen-lockfile
      provenance-version: v0.1.3
