[install]
# 5-day quarantine: reject package versions published
# less than 5 days ago to mitigate supply chain attacks.
# First-party @stll/* engines + their napi-rs platform sub-packages
# are excluded so they're installable immediately after release.
minimumReleaseAge = 432_000
minimumReleaseAgeExcludes = [
  # bun-types ships only declarations and must match the pinned Bun runtime.
  "bun-types", # quarantine-expires: 2026-10-27T10:17:50.170Z
  "@stll/oxlint-plugin", # quarantine-excluded-since: 2026-10-16T20:29:00.000Z
  "@stll/typescript-config", # quarantine-excluded-since: 2026-05-31T22:16:56.000Z
  "@stll/oxlint-config", # quarantine-excluded-since: 2026-05-31T22:16:56.000Z
  "@stll/aho-corasick", # quarantine-excluded-since: 2026-04-17T11:14:22.000Z
  "@stll/aho-corasick-darwin-arm64", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
  "@stll/aho-corasick-darwin-x64", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
  "@stll/aho-corasick-linux-arm64-gnu", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
  "@stll/aho-corasick-linux-x64-gnu", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
  "@stll/aho-corasick-win32-x64-msvc", # quarantine-excluded-since: 2026-06-11T12:33:18.000Z
  "@stll/aho-corasick-wasm", # quarantine-excluded-since: 2026-04-17T11:14:22.000Z
  "@stll/aho-corasick-wasm32-wasi", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
  "@stll/fuzzy-search", # quarantine-excluded-since: 2026-04-17T11:14:22.000Z
  "@stll/fuzzy-search-darwin-arm64", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
  "@stll/fuzzy-search-darwin-x64", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
  "@stll/fuzzy-search-linux-arm64-gnu", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
  "@stll/fuzzy-search-linux-x64-gnu", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
  "@stll/fuzzy-search-win32-x64-msvc", # quarantine-excluded-since: 2026-06-11T12:33:18.000Z
  "@stll/fuzzy-search-wasm", # quarantine-excluded-since: 2026-04-17T11:14:22.000Z
  "@stll/fuzzy-search-wasm32-wasi", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
  "@stll/regex-set", # quarantine-excluded-since: 2026-04-17T11:14:22.000Z
  "@stll/regex-set-darwin-arm64", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
  "@stll/regex-set-darwin-x64", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
  "@stll/regex-set-linux-arm64-gnu", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
  "@stll/regex-set-linux-x64-gnu", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
  "@stll/regex-set-win32-x64-msvc", # quarantine-excluded-since: 2026-06-11T12:33:18.000Z
  "@stll/regex-set-wasm", # quarantine-excluded-since: 2026-04-17T11:14:22.000Z
  "@stll/regex-set-wasm32-wasi", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
]

[fmt]
printWidth = 80
ignorePatterns = [
  # Shared generated files (stll-toolchain formatter policy).
  ".ai/shared/**",
  ".agents/skills/**",
  ".claude/skills/**",
  "**/AGENTS.md",
  "**/GEMINI.md",
  "**/CLAUDE.md",
  ".github/dependabot.yml",
  "**/fixtures/**",
  "**/__fixtures__/**",
  "**/testdata/**",
  "**/__snapshots__/**",
  "provenance/",
]

[fmt.sortImports]
customGroups = [
  { groupName = "react", elementNamePattern = [
    "react",
    "react-dom",
    "react-dom/**",
  ] },
  { groupName = "stella", elementNamePattern = ["@stll/**"] },
  { groupName = "aliases", elementNamePattern = ["@/**"] },
]
groups = [
  "react",
  ["builtin", "external", "type-builtin", "type-external"],
  "stella",
  "aliases",
  ["parent", "sibling", "index", "type-parent", "type-sibling", "type-index"],
]
newlinesBetween = true
