[install]
# 5-day quarantine: reject package versions published
# less than 5 days ago to mitigate supply chain attacks.
# First-party @stll/* engines + their napi-rs platform sub-packages
# are excluded so they're installable immediately after release.
minimumReleaseAge = 432_000
minimumReleaseAgeExcludes = [
  "@stll/typescript-config", # quarantine-excluded-since: 2026-05-31T22:16:56.000Z
  "@stll/oxlint-config", # quarantine-excluded-since: 2026-05-31T22:16:56.000Z
  "@stll/aho-corasick", # quarantine-excluded-since: 2026-04-17T11:14:22.000Z
  "@stll/aho-corasick-darwin-arm64", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
  "@stll/aho-corasick-darwin-x64", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
  "@stll/aho-corasick-linux-arm64-gnu", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
  "@stll/aho-corasick-linux-x64-gnu", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
  "@stll/aho-corasick-win32-x64-msvc", # quarantine-excluded-since: 2026-06-11T12:33:18.000Z
  "@stll/aho-corasick-wasm", # quarantine-excluded-since: 2026-04-17T11:14:22.000Z
  "@stll/aho-corasick-wasm32-wasi", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
  "@stll/fuzzy-search", # quarantine-excluded-since: 2026-04-17T11:14:22.000Z
  "@stll/fuzzy-search-darwin-arm64", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
  "@stll/fuzzy-search-darwin-x64", # quarantine-excluded-since: 2026-05-15T09:10:36.000Z
