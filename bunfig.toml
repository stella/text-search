  "@stll/fuzzy-search-win32-x64-msvc", # quarantine-excluded-since: 2026-06-11T12:33:18.000Z
  "@stll/fuzzy-search-wasm", # quarantine-excluded-since: 2026-04-17T11:14:22.000Z
